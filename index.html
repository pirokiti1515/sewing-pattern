// small helpers
function mk(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ===== Parts management =====
const DEFAULT_COLOR = "#2563eb"; // all parts start blue; changeable per part
function newPart(nodes, closed){
  const part = { id: "p"+(idCounter++), name: "", qty: 1, fabric: "", color: DEFAULT_COLOR, seam: 0, stitch: 0, closed: !!closed, group: null, nodes, notches: [] };
  migratePart(part);
  project.parts.push(part);
  selectedPartId = part.id;
  saveLocal();
  return part;
}
function deletePart(id){
  pushUndo();
  project.parts = project.parts.filter(p=>p.id!==id);
  if (selectedPartId===id) selectedPartId = null;
  saveLocal(); render();
}
// Duplicate a part, offset by (dx,dy) mm, as a new selected part.
function duplicatePart(part, dx, dy){
  const copy = JSON.parse(JSON.stringify(part));
  copy.id = "p"+(idCounter++);
  copy.group = null; // a fresh copy isn't part of the source's group
  copy.name = part.name ? part.name + "（複製）" : "";
  copy.nodes = copy.nodes.map(nd => ({ x:nd.x+dx, y:nd.y+dy, hIn:nd.hIn, hOut:nd.hOut }));
  if (copy.notches) copy.notches = copy.notches.map(p => ({ x:p.x+dx, y:p.y+dy }));
  project.parts.push(copy);
  selectedPartId = copy.id;
  return copy;
}
// Rotate a part in place by `deg` degrees around its centroid (rotates handles + notches too).
function rotatePart(part, deg){
  const rad = deg*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  const c = centroid(part.nodes);
  const rot = (p)=>({ x: c.x + (p.x-c.x)*cos - (p.y-c.y)*sin, y: c.y + (p.x-c.x)*sin + (p.y-c.y)*cos });
  const rotOff = (o)=> o ? { x: o.x*cos - o.y*sin, y: o.x*sin + o.y*cos } : null;
  part.nodes = part.nodes.map(nd => { const p = rot(nd); return { x:p.x, y:p.y, hIn:rotOff(nd.hIn), hOut:rotOff(nd.hOut) }; });
  if (part.notches) part.notches = part.notches.map(rot);
}
// Flip a part in place. axis: "h" = left-right (mirror X), "v" = up-down (mirror Y).
function flipPart(part, axis){
  const c = centroid(part.nodes);
  const flip = (p)=> axis==="h" ? { x: 2*c.x - p.x, y: p.y } : { x: p.x, y: 2*c.y - p.y };
  const flipOff = (o)=> o ? (axis==="h" ? { x:-o.x, y:o.y } : { x:o.x, y:-o.y }) : null;
  part.nodes = part.nodes.map(nd => { const p = flip(nd); return { x:p.x, y:p.y, hIn:flipOff(nd.hIn), hOut:flipOff(nd.hOut) }; });
  if (part.notches) part.notches = part.notches.map(flip);
}
// Round a corner node with a tangent circular arc (fillet) of the given radius.
function filletNode(part, idx, radius){
  const nodes = part.nodes, n = nodes.length, closed = part.closed;
  if (n < 3) return false;
  if (!closed && (idx===0 || idx===n-1)) return false; // endpoints of an open path have one edge
  const cur = nodes[idx];
  const prev = nbNode(nodes, idx-1, closed);
  const next = nbNode(nodes, idx+1, closed);
  let v1 = { x: prev.x-cur.x, y: prev.y-cur.y }; const l1 = Math.hypot(v1.x,v1.y);
  let v2 = { x: next.x-cur.x, y: next.y-cur.y }; const l2 = Math.hypot(v2.x,v2.y);
  if (l1<1e-6 || l2<1e-6) return false;
  v1 = { x:v1.x/l1, y:v1.y/l1 }; v2 = { x:v2.x/l2, y:v2.y/l2 };
  const dot = Math.max(-1, Math.min(1, v1.x*v2.x + v1.y*v2.y));
  const angle = Math.acos(dot); // angle between the two edges at the corner
  if (angle < 0.01 || Math.PI-angle < 0.01) return false; // nearly straight
  let d = radius / Math.tan(angle/2);           // distance from corner to each tangent point
  d = Math.min(d, l1*0.98, l2*0.98);            // clamp so tangent points stay on the edges
  const R = d * Math.tan(angle/2);              // actual radius after clamping
  const arcAngle = Math.PI - angle;             // arc sweep
  const k = (4/3) * Math.tan(arcAngle/4) * R;   // cubic-bézier handle length for a circular arc
  const T1 = { x: cur.x + v1.x*d, y: cur.y + v1.y*d };
  const T2 = { x: cur.x + v2.x*d, y: cur.y + v2.y*d };
  const nodeA = { x:T1.x, y:T1.y, hIn:null,                       hOut:{ x:-v1.x*k, y:-v1.y*k } };
  const nodeB = { x:T2.x, y:T2.y, hIn:{ x:-v2.x*k, y:-v2.y*k },  hOut:null };
  nodes.splice(idx, 1, nodeA, nodeB);
  return true;
}
function findPartAt(worldPt){
  // hit test: inside polygon
  for (let i=project.parts.length-1;i>=0;i--){
    const part = project.parts[i];
    if (part.closed && part.nodes.length>=3 && pointInPoly(worldPt, part.nodes)) return part;
  }
  return null;
}
// Snap a point onto a nearby part vertex, else fall back to the grid.
function snapToVertex(wp){
  const thr = 12 / view.scale;
  let best = { d: thr, pt: null };
  for (const part of project.parts){
    for (const nd of part.nodes){
      const d = Math.hypot(nd.x-wp.x, nd.y-wp.y);
      if (d < best.d) best = { d, pt: { x:nd.x, y:nd.y } };
    }
  }
  return best.pt || maybeSnap(wp);
}
// Distance from a point to a line segment.
function distToSeg(p, a, b){
  const abx=b.x-a.x, aby=b.y-a.y, len2=abx*abx+aby*aby||1;
  let t=((p.x-a.x)*abx+(p.y-a.y)*aby)/len2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+abx*t), p.y-(a.y+aby*t));
}
// Which edge (segment) of a part is under the cursor? Returns {part, i} (segment starts at node i).
function findEdgeAt(sp, partId){
  const part = project.parts.find(p=>p.id===partId);
  if (!part || part.nodes.length<2) return null;
  const wp = screenToWorld(sp.x, sp.y);
  const thr = 10 / view.scale;
  const n = part.nodes.length, segCount = part.closed ? n : n-1;
  let best = { d: Infinity, i: -1 };
  for (let i=0;i<segCount;i++){
    const seg = segControls(part.nodes, i, part.closed);
    let prev = seg.A;
    for (let t=1;t<=10;t++){
      const q = seg.straight
        ? { x: seg.A.x+(seg.B.x-seg.A.x)*t/10, y: seg.A.y+(seg.B.y-seg.A.y)*t/10 }
        : bezierAt(seg, t/10);
      const d = distToSeg(wp, prev, q);
      if (d < best.d) best = { d, i };
      prev = q;
    }
  }
  return best.d < thr ? { part, i: best.i } : null;
}
// Hit-test open paths (stitch lines / arrows) by proximity to the line itself.
function findLinePartAt(wp){
  const thr = 14 / view.scale;   // generous: thin lines are hard to hit exactly
  let best = { d: Infinity, part: null };
  for (const part of project.parts){
    if (part.closed || part.nodes.length < 2) continue;
    const flat = flattenNodes(part.nodes, false);
    const near = nearestOnOutline(flat, wp, false);
    if (near.d < thr && near.d < best.d) best = { d: near.d, part };
  }
  return best.part;
}
function pointInPoly(pt, poly){
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if (((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

// ===== Tool switching =====
function setTool(t){
  if (editingTextId!=null && typeof commitTextEditor==="function") commitTextEditor();
  if (draft && draft.nodes.length && t!==tool) commitDraft();
  if (typeof filletReset==="function") filletReset();
  tool = t;
  if (t!=="select"){ multiSel = []; marquee = null; selMove = null; }
  if (t!=="select" && t!=="text") selTexts = [];
  document.querySelectorAll("button.tool").forEach(b=>b.classList.toggle("active", b.dataset.tool===t));
  // the 図形 (shape) button stands in for rect/ellipse
  const shapeBtn = document.getElementById("tool-shape");
  if (shapeBtn){
    const isShape = (t==="rect" || t==="ellipse");
    shapeBtn.classList.toggle("active", isShape);
    if (isShape) document.getElementById("shape-ic").textContent = (t==="rect") ? "▭" : "◯";
  }
  render();
}

// ===== Draft (drawing) =====
function commitDraft(){
  if (!draft){ render(); return; }
  if (draft.kind==="stitch"){
    // stitch line = an OPEN dashed path
    if (draft.nodes.length>=2){ pushUndo(); const p = newPart(draft.nodes.slice(), false); p.kind = "stitch"; p.color = STITCH_COLOR; }
  } else {
    if (draft.nodes.length>=2){ pushUndo(); }
    if (draft.nodes.length>=3){ newPart(draft.nodes.slice(), true); }
    else if (draft.nodes.length===2){ newPart(draft.nodes.slice(), false); }
  }
  draft = null;
  render();
}
function cancelDraft(){ draft = null; render(); }

// ===== Event handling =====
svg.addEventListener("mousedown", (e)=>{
  svgRect = svg.getBoundingClientRect();   // toolbar height can change -> refresh once per gesture
  if (e.button===2 || (e.button===0 && e.ctrlKey)){   // Macのcontrol+クリックも右クリック扱い
    // 右ボタン: 動かせば画面移動、動かさずに離せばメニュー（判定は mouseup で）
    const s = svgPoint(e);
    rightPan = { x:s.x, y:s.y, tx:view.tx, ty:view.ty, moved:false };
    return;
  }
  const sp = svgPoint(e);
  const wp = screenToWorld(sp.x, sp.y);
  gestureSnap = snap(); // remember state so the whole gesture becomes one undo step

  if (e.button===1){  // 中ボタンでも画面移動（Altは曲線ハンドルの左右独立用に確保）
    panning = { x: sp.x, y: sp.y, tx: view.tx, ty: view.ty };
    return;
  }
  // Notch tool: click near an outline to drop a match mark on the nearest part
  if (tool==="notch"){
    let best = { d: Infinity, part: null, pt: null };
    for (const part of project.parts){
      if (!part.closed || part.nodes.length < 3) continue;
      const flat = flattenNodes(part.nodes, true);
      const near = nearestOnOutline(flat, wp, true);
      const dPx = near.d * view.scale;
      if (dPx < best.d){ best = { d: dPx, part, pt: near.pt }; }
    }
    if (best.part && best.d < 20){
      if (!best.part.notches) best.part.notches = [];
      best.part.notches.push({ x: Math.round(best.pt.x), y: Math.round(best.pt.y) });
      selectedPartId = best.part.id;
      saveLocal(); render();
    }
    return;
  }
  // Text tool: click empty to create a text (opens editor); click a text to edit; drag to move
  if (tool==="text"){
    if (editingTextId!=null) commitTextEditor();
    const hit = findTextAt(wp);
    if (hit){ selTexts = [hit.id]; textDrag = { id:hit.id, startW:wp, ox:hit.x, oy:hit.y, moved:false, editOnClick:true }; }
    else {
      const t = { id:"t"+(idCounter++), x:Math.round(wp.x), y:Math.round(wp.y), text:"",
                  size: parseFloat(document.getElementById("text-size").value)||20,
                  color: document.getElementById("text-color").value || "#111827",
                  vertical: document.getElementById("text-vertical").checked,
                  font: document.getElementById("text-font").value,
                  bold: document.getElementById("text-bold").checked, group:null };
      project.texts.push(t);
      openTextEditor(t, true);
    }
    return;
  }
  // Rectangle / Ellipse / Arrow: drag from start to end
  if (tool==="rect" || tool==="ellipse" || tool==="arrow" || tool==="dim"){
    shapeDrag = { start: (tool==="dim") ? snapToVertex(wp) : maybeSnap(wp) };
    render();
    return;
  }
  // ===== 選択・編集ツール（すべてここに集約）=====
  // 曲線ハンドル → 頂点 → 辺 → パーツ全体 → 範囲選択 の順に判定する
  if (tool==="select"){
    // 文字を最優先で拾う（クリックで選択、ドラッグで移動、ダブルクリックで編集）
    const ht = findTextAt(wp);
    if (ht){
      const now = Date.now();
      if (lastTClick.id===ht.id && (now - lastTClick.t) < 400){
        lastTClick = { id:null, t:0 }; render(); openTextEditor(ht, false); return;
      }
      lastTClick = { id:ht.id, t:now };
      // すでに複数選択の一部なら、その選択をまとめて動かす
      const inSel = selTexts.includes(ht.id);
      const spanning = multiSel.length>0 || selTexts.length>1;
      if (inSel && spanning){
        selectedPartId = selectedPartId || null; selVertex = null;
        selMove = { startW: wp,
          orig: multiSel.map(m=>{ const nd=nodeOf(m); return { partId:m.partId, idx:m.idx, x:nd.x, y:nd.y }; }),
          origTexts: selTexts.map(id=>{ const t=project.texts.find(x=>x.id===id); return t?{id,x:t.x,y:t.y}:null; }).filter(Boolean) };
        render(); return;
      }
      // グループに属する文字なら、そのグループごと選ぶ
      if (ht.group){
        const gp = project.parts.filter(p=>p.group===ht.group);
        const gt = project.texts.filter(t=>t.group===ht.group).map(t=>t.id);
        multiSel = []; gp.forEach(p=>p.nodes.forEach((_,i)=>multiSel.push({partId:p.id, idx:i})));
        selTexts = gt; selectedPartId = gp.length?gp[0].id:null; selVertex = null; selMode = "part";
        selMove = { startW: wp,
          orig: multiSel.map(m=>{ const nd=nodeOf(m); return { partId:m.partId, idx:m.idx, x:nd.x, y:nd.y }; }),
          origTexts: selTexts.map(id=>{ const t=project.texts.find(x=>x.id===id); return t?{id,x:t.x,y:t.y}:null; }).filter(Boolean) };
        render(); return;
      }
      selTexts = [ht.id]; selectedPartId = null; multiSel = []; selVertex = null;
      textDrag = { id:ht.id, startW:wp, ox:ht.x, oy:ht.y, moved:false, editOnClick:false };
      render(); return;
    }
    const startMove = (list, textIds)=>{
      multiSel = list;
      if (textIds !== undefined) selTexts = textIds;
      selMove = { startW: wp,
        orig: list.map(m=>{ const nd=nodeOf(m); return { partId:m.partId, idx:m.idx, x:nd.x, y:nd.y }; }),
        origTexts: selTexts.map(id=>{ const t=project.texts.find(x=>x.id===id); return t?{id, x:t.x, y:t.y}:null; }).filter(Boolean) };
    };

    // 0) 拡大縮小ハンドル（選択範囲の枠）を最優先
    const rh = findResizeHandleAt(sp);
    if (rh){ beginScale(rh, wp); render(); return; }
    // 1) ベジェハンドル：曲線の曲がり具合を調整
    const h = findHandleAt(sp);
    if (h && !e.shiftKey){
      handleDrag = { partId: h.part.id, index: h.idx, which: h.which };
      selectedPartId = h.part.id; return;
    }
    const v = findVertexAt(sp);
    // 2) Shift+クリック：輪郭に点を追加してそのままドラッグ
    if (e.shiftKey && !v){
      const part = selectedPartId ? project.parts.find(p=>p.id===selectedPartId) : (findPartAt(wp)||findLinePartAt(wp));
      if (part){
        selectedPartId = part.id;
        const idx = insertNodeAt(part, wp);
        if (idx>=0){ selVertex={partId:part.id, idx}; selMode="points"; startMove([{partId:part.id, idx}]); render(); return; }
      }
    }
    // 3) 頂点：その点だけを動かす（ダブルクリックで角↔曲線）
    if (v){
      selectedPartId = v.part.id;
      selVertex = { partId: v.part.id, idx: v.idx };
      const now = Date.now();
      if (lastVClick.id===v.part.id && lastVClick.idx===v.idx && (now - lastVClick.t) < 400){
        toggleNodeSmooth(v.part.nodes, v.idx, v.part.closed);
        lastVClick = { id:null, idx:-1, t:0 }; saveLocal(); render(); return;
      }
      lastVClick = { id:v.part.id, idx:v.idx, t:now };
      // 複数点を囲んで選んでいた場合だけ、その一団をまとめて動かす
      const inPointSel = (selMode==="points") && multiSel.some(m=>m.partId===v.part.id && m.idx===v.idx) && multiSel.length>1;
      selMode = "points";
      startMove(inPointSel ? multiSel : [{ partId:v.part.id, idx:v.idx }]);
      render(); return;
    }
    // 4) 辺の中央ハンドル：つかむとその辺ごと動いて長さ・形が変わる
    if (selectedPartId){
      const me = findMidEdgeAt(sp, selectedPartId);
      if (me){
        const n = me.part.nodes.length;
        selVertex = null; selMode = "points";
        startMove([{ partId:me.part.id, idx:me.i }, { partId:me.part.id, idx:(me.i+1)%n }]);
        render(); return;
      }
    }
    // 5) パーツ／線をクリック：まるごと選択（グループなら全部）
    const part = findPartAt(wp) || findLinePartAt(wp);
    if (part){
      // すでに複数選択されている中のパーツを掴んだら、選択はそのままで全部動かす
      const inSel = multiSel.some(m=>m.partId===part.id);
      const spanning = new Set(multiSel.map(m=>m.partId)).size > 1 || selTexts.length > 0;
      if (inSel && spanning){
        selectedPartId = part.id; selVertex = null;
        startMove(multiSel);
        render(); return;
      }
      selectedPartId = part.id; selVertex = null; selMode = "part";
      const g = part.group;
      const groupParts = g ? project.parts.filter(p=>p.group===g) : [part];
      const groupTexts = g ? project.texts.filter(t=>t.group===g).map(t=>t.id) : [];
      const list = [];
      for (const gp of groupParts) gp.nodes.forEach((_,i)=>list.push({ partId:gp.id, idx:i }));
      startMove(list, groupTexts);
      render(); return;
    }
    // 6) 空き：範囲選択
    multiSel = []; selectedPartId = null; selVertex = null; selMode = "points"; selTexts = [];
    marquee = { x0:sp.x, y0:sp.y, x1:sp.x, y1:sp.y };
    render(); return;
  }
  // ステッチツール：辺をクリックすると、その辺だけに内側の点線を付け外し
  if (tool==="stitch" && !draft){
    const eg = findAnyEdgeAt(sp);
    if (eg){
      pushUndo();
      const part = eg.part, mm = Math.max(1, parseFloat(document.getElementById("stitch-mm").value)||5);
      if (!Array.isArray(part.stitchEdges)) part.stitchEdges = [];
      const at = part.stitchEdges.indexOf(eg.i);
      if (at >= 0) part.stitchEdges.splice(at,1); else part.stitchEdges.push(eg.i);
      part.stitch = part.stitchEdges.length ? mm : 0;
      if (!part.stitchEdges.length) part.stitchEdges = null;
      selectedPartId = part.id;
      saveLocal(); render();
      return;
    }
  }
  if (tool==="draw" || tool==="stitch"){
    // pen/stitch: click near the first point closes (draw only; stitch stays open)
    if (tool==="draw" && draft && draft.nodes.length>=2){
      const s0 = worldToScreen(draft.nodes[0]);
      if (Math.hypot(sp.x-s0.x, sp.y-s0.y) < 12){ commitDraft(); return; }
    }
    // place an anchor; drag before releasing pulls out symmetric bézier handles
    const p = maybeSnap(wp);
    if (!draft) draft = { nodes: [], kind: (tool==="stitch" ? "stitch" : "part") };
    const node = { x:p.x, y:p.y, hIn:null, hOut:null };
    draft.nodes.push(node);
    penDrag = { index: draft.nodes.length-1, anchor: { x:p.x, y:p.y } };
    render();
  }
});

svg.addEventListener("mousemove", (e)=>{
  const sp = svgPoint(e);
  mouseWorld = screenToWorld(sp.x, sp.y);
  // 右ボタンを押したまま一定以上動かしたら画面移動を開始
  if (rightPan && !rightPan.moved && Math.hypot(sp.x-rightPan.x, sp.y-rightPan.y) > 4){
    rightPan.moved = true;
    panning = { x: rightPan.x, y: rightPan.y, tx: rightPan.tx, ty: rightPan.ty };
    hideContextMenu();
    svg.classList.add("panning");
  }
  if (panning){
    view.tx = panning.tx + (sp.x - panning.x);
    view.ty = panning.ty + (sp.y - panning.y);
    renderThrottled();
    return;
  }
  // Editing a bézier handle endpoint (mirror the opposite handle unless Alt held)
  if (handleDrag){
    const part = project.parts.find(p=>p.id===handleDrag.partId);
    if (part){
      const nd = part.nodes[handleDrag.index];
      const off = { x: mouseWorld.x - nd.x, y: mouseWorld.y - nd.y };
      if (handleDrag.which==="out"){ nd.hOut = off; if (nd.hIn && !e.altKey) nd.hIn = { x:-off.x, y:-off.y }; }
      else { nd.hIn = off; if (nd.hOut && !e.altKey) nd.hOut = { x:-off.x, y:-off.y }; }
      renderThrottled();
    }
    return;
  }
  // Pen tool: dragging after placing an anchor pulls out symmetric handles
  if (penDrag && draft){
    const nd = draft.nodes[penDrag.index];
    const dx = mouseWorld.x - penDrag.anchor.x, dy = mouseWorld.y - penDrag.anchor.y;
    if (Math.hypot(dx,dy)*view.scale > 3){ nd.hOut = { x:dx, y:dy }; nd.hIn = { x:-dx, y:-dy }; }
    else { nd.hOut = null; nd.hIn = null; }
    renderThrottled();
    return;
  }
  // Moving a text label
  if (textDrag){
    const t = project.texts.find(x=>x.id===textDrag.id);
    if (t){ t.x = textDrag.ox + (mouseWorld.x - textDrag.startW.x); t.y = textDrag.oy + (mouseWorld.y - textDrag.startW.y);
      if (Math.hypot(mouseWorld.x-textDrag.startW.x, mouseWorld.y-textDrag.startW.y) > 2) textDrag.moved = true; renderThrottled(); }
    return;
  }
  // Rectangle / ellipse preview while dragging
  if (shapeDrag){ renderThrottled(); return; }
  if (scaleDrag){ applyScale(e.shiftKey); return; }
  // Selection tool: dragging a marquee, or moving the selected points
  if (marquee){
    marquee.x1 = sp.x; marquee.y1 = sp.y;
    multiSel = pointsInRect(marquee.x0, marquee.y0, marquee.x1, marquee.y1);
    selTexts = textsInRect(marquee.x0, marquee.y0, marquee.x1, marquee.y1);
    renderThrottled();
    return;
  }
  if (selMove){
    let dwx = mouseWorld.x - selMove.startW.x, dwy = mouseWorld.y - selMove.startW.y;
    if (document.getElementById("chk-snap").checked){
      const g = Math.max(1, parseFloat(document.getElementById("grid-size").value)||10);
      dwx = Math.round(dwx/g)*g; dwy = Math.round(dwy/g)*g;
    }
    const adj = magnetAdjust(selMove.orig, dwx, dwy);   // snap to other parts' corners/edges
    dwx = adj.dwx; dwy = adj.dwy;
    for (const o of selMove.orig){ const nd = nodeOf(o); if (nd){ nd.x = o.x + dwx; nd.y = o.y + dwy; } }
    for (const o of (selMove.origTexts||[])){ const t = project.texts.find(x=>x.id===o.id); if (t){ t.x = o.x + dwx; t.y = o.y + dwy; } }
    renderThrottled();
    return;
  }
  if (drag){
    const part = project.parts.find(p=>p.id===drag.partId);
    if (part){ const nd = part.nodes[drag.index]; const s = maybeSnap(mouseWorld); nd.x = s.x; nd.y = s.y; renderThrottled(); }
    return;
  }
  if ((tool==="draw"||tool==="stitch") && draft){ renderThrottled(); }
  else {
    // highlight the edge under the cursor so it's obvious you can grab it
    if (tool==="select" && selectedPartId && !selMove && !handleDrag){
      const eg = findMidEdgeAt(sp, selectedPartId);
      const key = eg ? eg.part.id+":"+eg.i : null;
      const prev = hoverEdge ? hoverEdge.partId+":"+hoverEdge.i : null;
      if (key !== prev){ hoverEdge = eg ? { partId:eg.part.id, i:eg.i } : null; renderThrottled(); return; }
    } else if (hoverEdge){ hoverEdge = null; renderThrottled(); return; }
    updateHint();
  }
});

window.addEventListener("mouseup", (e)=>{
  // 右ボタンを離した: 動かしていなければメニュー、動かしていたら移動しただけ
  if (rightPan){   // ボタン番号ではなく状態で判定（control+クリックは button 0 で来るため）
    const moved = rightPan.moved, at = { x: rightPan.x, y: rightPan.y };
    rightPan = null; panning = null; svg.classList.remove("panning");
    if (moved){ saveLocal(); render(); }
    else openContextMenu(at);
    return;
  }
  // Only act when a canvas gesture was actually in progress. Without this, a plain
  // click in the sidebar also ran render(), rebuilding the parts list and destroying
  // the input the user just clicked (and cancelling a row drag).
  if (!textDrag && !shapeDrag && !drag && !handleDrag && !selMove &&
      !penDrag && !panning && !marquee && gestureSnap === null) return;
  // finish a text drag: a click (no move) opens the editor; a drag commits the move
  if (textDrag){
    const t = project.texts.find(x=>x.id===textDrag.id);
    if (t && !textDrag.moved && textDrag.editOnClick) openTextEditor(t, false);
    else if (textDrag.moved) saveLocal();
    textDrag = null; commitGesture(); render(); return;
  }
  // finish a rectangle/ellipse/arrow drag by creating the part
  if (shapeDrag){
    const a = shapeDrag.start, b = maybeSnap(mouseWorld);
    if (tool==="dim"){
      const e2 = snapToVertex(mouseWorld);
      if (Math.hypot(a.x-e2.x, a.y-e2.y) > 3){
        const p = newPart([{x:a.x,y:a.y,hIn:null,hOut:null},{x:e2.x,y:e2.y,hIn:null,hOut:null}], false);
        p.kind = "dim"; p.color = "#111827";
      }
    } else if (tool==="arrow"){
      if (Math.hypot(a.x-b.x, a.y-b.y) > 3){
        const p = newPart([{x:a.x,y:a.y,hIn:null,hOut:null},{x:b.x,y:b.y,hIn:null,hOut:null}], false);
        p.kind = "arrow"; p.color = "#111827";
      }
    } else if (Math.abs(a.x-b.x) > 2 && Math.abs(a.y-b.y) > 2){
      const nodes = (tool==="rect") ? rectNodes(a,b) : ellipseNodes(a,b);
      newPart(nodes, true);   // gestureSnap (set on mousedown) makes this one undo step
    }
    shapeDrag = null;
  }
  if (drag || handleDrag || selMove || scaleDrag){ saveLocal(); }
  scaleDrag = null;
  drag = null; panning = null; penDrag = null; handleDrag = null; selMove = null; marquee = null; snapGuides = []; hoverEdge = null;
  commitGesture();
  render();
});

// Right-click: delete a notch / vertex if pointing at one; otherwise show the menu
// macOS はマウスを押した時点で contextmenu が飛んでくるので、ここでは開かない。
// 右ドラッグ＝画面移動と区別するため、実際に開くのは mouseup（openContextMenu）。
svg.addEventListener("contextmenu", (e)=>{ e.preventDefault(); });

function openContextMenu(sp){
  // Remove a notch if right-clicking near one (any tool)
  for (const part of project.parts){
    if (!part.notches) continue;
    for (let i=0;i<part.notches.length;i++){
      const s = worldToScreen(part.notches[i]);
      if (Math.hypot(sp.x-s.x, sp.y-s.y) < 10){
        part.notches.splice(i,1); saveLocal(); render(); return;
      }
    }
  }
  if (tool==="select"){
    const v = findVertexAt(sp);
    if (v){
      const minNodes = v.part.closed ? 3 : 2;
      if (v.part.nodes.length > minNodes){ selectedPartId = v.part.id; v.part.nodes.splice(v.idx,1); saveLocal(); render(); }
      return;
    }
  }
  // right-clicked ON an object -> that object's menu (colour / duplicate / delete)
  const wp = screenToWorld(sp.x, sp.y);
  const txt = findTextAt(wp);
  const obj = findPartAt(wp) || findLinePartAt(wp);
  if (txt || obj){ showObjectMenu(sp.x, sp.y, obj, txt); return; }
  // otherwise: the file/view menu
  showFileMenu(sp.x, sp.y);
}
let ctxTarget = null;   // { part } or { text } the object menu is acting on
function placeMenu(m, x, y){
  m.style.left = x + "px"; m.style.top = y + "px"; m.classList.add("show");
}
function showFileMenu(x, y){
  ctxTarget = null;
  const m = document.getElementById("context-menu");
  m.innerHTML = `
    <button data-cmd="fit">🔎 全体表示</button>
    <button data-cmd="save">💾 保存</button>
    <button data-cmd="load">📂 開く</button>
    <button data-cmd="print">🖨 印刷</button>`;
  placeMenu(m, x, y);
}
function showObjectMenu(x, y, part, text){
  ctxTarget = text ? { text } : { part };
  const cur = text ? (text.color||"#111827") : (part.color||"#2563eb");
  const label = text ? `「${(text.text||"文字").slice(0,10)}」`
                     : (part.kind==="stitch" ? "🧵 ステッチ線" : part.kind==="arrow" ? "↗ 矢印"
                        : (part.name && part.name.trim() ? "▭ "+part.name : "▭ パーツ"));
  const m = document.getElementById("context-menu");
  m.innerHTML = `
    <div class="cm-title">${escapeHtml(label)}</div>
    <div class="cm-colors">${COLORS.map(c=>`<button class="chip${cur===c?' on':''}" data-color="${c}" title="この色にする" style="background:${c}"></button>`).join("")}</div>
    <div class="cm-sep"></div>
    ${(part && part.closed && !part.kind) ? (part.stitch>0
        ? `<button data-cmd="stitchoff">🧵 内側のステッチを消す</button>`
        : `<button data-cmd="stitchon">🧵 内側にステッチを入れる</button>`) : ""}
    ${part ? `<button data-cmd="dupobj">複製</button>` : ""}
    <button data-cmd="delobj">🗑 削除</button>`;
  placeMenu(m, x, y);
}
function showContextMenu(x, y){ showFileMenu(x, y); }
function hideContextMenu(){ document.getElementById("context-menu").classList.remove("show"); }
document.getElementById("context-menu").addEventListener("click", (e)=>{
  // colour chip inside the object menu
  if (e.target.classList.contains("chip") && ctxTarget){
    pushUndo();
    const c = e.target.dataset.color;
    if (ctxTarget.text) ctxTarget.text.color = c; else ctxTarget.part.color = c;
    saveLocal(); render(); hideContextMenu(); return;
  }
  const cmd = e.target.dataset.cmd; if (!cmd) return;
  hideContextMenu();
  if (cmd==="fit") fitView();
  else if (cmd==="save") document.getElementById("btn-save").click();
  else if (cmd==="load") document.getElementById("btn-load").click();
  else if (cmd==="print") window.print();
  else if (cmd==="delobj" && ctxTarget){
    pushUndo();
    if (ctxTarget.text) project.texts = project.texts.filter(t=>t.id!==ctxTarget.text.id);
    else project.parts = project.parts.filter(p=>p.id!==ctxTarget.part.id);
    selectedPartId=null; multiSel=[]; saveLocal(); render();
  }
  else if (cmd==="stitchon" && ctxTarget && ctxTarget.part){
    const mm = Math.max(1, parseFloat(document.getElementById("stitch-mm").value)||5);
    stitchInside(ctxTarget.part, mm);
  }
  else if (cmd==="stitchoff" && ctxTarget && ctxTarget.part){
    stitchInside(ctxTarget.part, 0);
  }
  else if (cmd==="dupobj" && ctxTarget && ctxTarget.part){
    pushUndo();
    const p = ctxTarget.part, xs = p.nodes.map(n=>n.x);
    duplicatePart(p, Math.round(Math.max(...xs)-Math.min(...xs)+40), 0);
    saveLocal(); render();
  }
});

// zoom with wheel (centered on cursor)
svg.addEventListener("wheel", (e)=>{
  e.preventDefault();
  const sp = svgPoint(e);
  const before = screenToWorld(sp.x, sp.y);
  const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
  view.scale = Math.min(40, Math.max(0.2, view.scale*factor));
  const after = screenToWorld(sp.x, sp.y);
  view.tx += (after.x - before.x)*view.scale;
  view.ty += (after.y - before.y)*view.scale;
  renderThrottled();
}, { passive: false });

window.addEventListener("keydown", (e)=>{
  if (e.target.tagName === "INPUT") return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="c"){ e.preventDefault(); copySelection(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="v"){ e.preventDefault(); pasteClipboard(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="x"){ e.preventDefault();
    if (copySelection()){ deleteSelection(); } return; }
  // tool keyboard shortcuts (Affinity-style)
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length===1){
    const map = { v:"select", p:"draw", t:"text", r:"rect", o:"ellipse", e:"select", n:"notch", s:"stitch", a:"arrow", d:"dim" };
    const k = e.key.toLowerCase();
    if (map[k]){ e.preventDefault(); setTool(map[k]); return; }
  }
  const drawing = (tool==="draw"||tool==="stitch") && draft;
  if (e.key==="Escape" && !drawing){ selectedPartId=null; multiSel=[]; selVertex=null; marquee=null; selTexts=[]; render(); }
  if (drawing){
    if (e.key==="Enter") commitDraft();
    else if (e.key==="Escape") cancelDraft();
    else if (e.key==="Backspace"){ e.preventDefault(); draft.nodes.pop(); if(!draft.nodes.length) draft=null; render(); }
  }

  if ((e.key==="Delete"||e.key==="Backspace") && tool==="select" && multiSel.length){
    e.preventDefault(); deleteSelection(); return;
  }
  if ((e.key==="Delete"||e.key==="Backspace") && tool==="edit_disabled" && selectedPartId && e.target.tagName!=="INPUT"){
    e.preventDefault(); deletePart(selectedPartId);
  }
});

// ----- drag the grip to reorder parts (also changes front/back stacking) -----
(() => {
  const list = document.getElementById("part-list");
  let dragRowId = null;
  const clearMarks = ()=> list.querySelectorAll(".part-item").forEach(d=>d.classList.remove("dragging","drop-before","drop-after"));
  list.addEventListener("dragstart", (e)=>{
    const item = e.target.closest(".part-item"); if (!item) return;
    dragRowId = item.dataset.part;
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragRowId); } catch(_){}
    item.classList.add("dragging");
  });
  list.addEventListener("dragend", ()=>{ dragRowId = null; clearMarks(); });
  list.addEventListener("dragover", (e)=>{
    if (!dragRowId) return;
    e.preventDefault();
    const item = e.target.closest(".part-item");
    if (!item || item.dataset.part === dragRowId) return;
    const r = item.getBoundingClientRect();
    const after = (e.clientY - r.top) > r.height/2;
    list.querySelectorAll(".part-item").forEach(d=>d.classList.remove("drop-before","drop-after"));
    item.classList.add(after ? "drop-after" : "drop-before");
  });
  list.addEventListener("drop", (e)=>{
    e.preventDefault();
    const item = e.target.closest(".part-item");
    if (!item || !dragRowId || item.dataset.part === dragRowId){ clearMarks(); return; }
    const r = item.getBoundingClientRect();
    const after = (e.clientY - r.top) > r.height/2;
    pushUndo();
    const from = project.parts.findIndex(p=>p.id===dragRowId);
    const moved = project.parts.splice(from,1)[0];
    let to = project.parts.findIndex(p=>p.id===item.dataset.part);
    if (after) to += 1;
    project.parts.splice(to, 0, moved);
    dragRowId = null; clearMarks();
    saveLocal(); render();
  });
})();

// ----- 接円弧 (fillet) live slider -----
// While a corner is selected in edit mode, the slider rounds it live from the
// corner's original state (captured once), committing one undo step on release.
let filletBase = null; // { nodes, partId, idx } — the corner's original state for this session
function filletLive(r){
  if (tool!=="select" || !selVertex){ if(!selVertex) filletHint(); return; }
  const part = project.parts.find(p=>p.id===selVertex.partId);
  if (!part) return;
  if (!filletBase || filletBase.partId!==part.id || filletBase.idx!==selVertex.idx){
    filletBase = { nodes: JSON.parse(JSON.stringify(part.nodes)), partId: part.id, idx: selVertex.idx };
    pushUndo(); // one undo step for the whole slider session on this corner
  }
  part.nodes = JSON.parse(JSON.stringify(filletBase.nodes));
  if (r > 0) filletNode(part, filletBase.idx, r);
  saveLocal(); render();
}
function filletReset(){ filletBase = null; }

function createShapeByDims(kind){
  const w = Math.max(1, parseFloat(document.getElementById("shape-w").value)||100);
  const h = Math.max(1, parseFloat(document.getElementById("shape-h").value)||100);
  const c = screenToWorld(vpW/2, vpH/2);
  let cx = Math.round(c.x), cy = Math.round(c.y);
  const a = { x: cx - w/2, y: cy - h/2 }, b = { x: cx + w/2, y: cy + h/2 };
  pushUndo();
  const nodes = (kind==="ellipse") ? ellipseNodes(a,b) : rectNodes(a,b);
  newPart(nodes, true);
  setTool("select"); selectedPartId = project.parts[project.parts.length-1].id;
  multiSel = project.parts[project.parts.length-1].nodes.map((_,i)=>({partId:selectedPartId, idx:i}));
  saveLocal(); render();
}

// ----- 内側にステッチ（輪郭に平行な点線）-----
function stitchInside(part, mm){
  if (!part || !part.closed || part.kind) return false;
  pushUndo();
  part.stitch = Math.max(0, mm||0);
  part.stitchEdges = null;          // whole outline
  if (!part.stitch) part.stitchEdges = null;
  saveLocal(); render();
  return true;
}
document.getElementById("btn-stitch-inside").addEventListener("click", ()=>{
  const mm = Math.max(1, parseFloat(document.getElementById("stitch-mm").value)||5);
  // switching to the stitch tool clears multiSel, so fall back to the last selected part
  let ids = [...new Set(multiSel.map(m=>m.partId))];
  if (!ids.length && selectedPartId) ids = [selectedPartId];
  const targets = ids.map(id=>project.parts.find(p=>p.id===id)).filter(p=>p && p.closed && !p.kind);
  if (!targets.length){ alert("先に「⬚ 選択」でパーツをクリックして選んでから押してください。"); return; }
  pushUndo();
  for (const t of targets) t.stitch = mm;
  saveLocal(); render();
});

// 字体・大きさ・色・太字・縦書き：選択中の文字（複数可）／編集中の文字にその場で反映
function applyTextProps(){
  const font = document.getElementById("text-font").value;
  const size = parseFloat(document.getElementById("text-size").value);
  const color = document.getElementById("text-color").value;
  const bold = document.getElementById("text-bold").checked;
  const vertical = document.getElementById("text-vertical").checked;
  const targets = [];
  if (editingTextId!=null){ const t=project.texts.find(x=>x.id===editingTextId); if(t) targets.push(t); }
  for (const id of selTexts){ const t=project.texts.find(x=>x.id===id); if(t && !targets.includes(t)) targets.push(t); }
  if (!targets.length) return;                       // 選択が無ければ「次に作る文字」の設定として残るだけ
  for (const t of targets){
    t.font=font; t.color=color; t.bold=bold; t.vertical=vertical;
    if (size>0) t.size=size;
  }
  if (editingTextId!=null){
    const t=project.texts.find(x=>x.id===editingTextId);
    const ed=document.getElementById("text-editor");
    if (t){ ed.style.fontSize=Math.max(11,t.size*view.scale)+"px"; ed.style.color=t.color;
            ed.style.fontFamily=fontOf(t); ed.style.fontWeight=t.bold?"700":"400"; }
  }
  saveLocal(); render();
}

// ===== Fit view =====
function fitView(){
  // include text extents too, otherwise labels/notes get cut off
  const all = project.parts.flatMap(p=>p.nodes).map(n=>({x:n.x,y:n.y}));
  for (const t of (project.texts||[])){
    const len = Math.max(1,(t.text||"").length) * (t.size||20) * 0.95, h2 = (t.size||20);
    if (t.vertical) all.push({x:t.x-h2/2, y:t.y}, {x:t.x+h2/2, y:t.y+len});
    else            all.push({x:t.x, y:t.y-h2/2}, {x:t.x+len, y:t.y+h2/2});
  }
  const w = vpW, h = vpH;
  if (all.length===0){ view = { scale: 2.5, tx: 60, ty: 60 }; render(); return; }
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  for (const n of all){ minx=Math.min(minx,n.x); miny=Math.min(miny,n.y); maxx=Math.max(maxx,n.x); maxy=Math.max(maxy,n.y); }
  const pad = 60;
  const sx = (w-2*pad)/Math.max(1,maxx-minx), sy=(h-2*pad)/Math.max(1,maxy-miny);
  view.scale = Math.min(40, Math.max(0.2, Math.min(sx,sy)));
  view.tx = pad - minx*view.scale;
  view.ty = pad - miny*view.scale;
  render();
}

  if (project.parts.length) return;
  // a demo seat panel 400x300 with a corner cut
  newPart([{x:0,y:0},{x:400,y:0},{x:400,y:220},{x:300,y:300},{x:0,y:300}], true);

  project.parts[0].fabric = "本革A";
}

window.addEventListener("resize", ()=>{ updateViewport(); render(); });
window.addEventListener("scroll", updateViewport, true);   // keep the cached rect honest
if (window.ResizeObserver) new ResizeObserver(()=>updateViewport()).observe(svg);
updateViewport();
loadLocal();
seedExample();
render();
fitView();
</script>
